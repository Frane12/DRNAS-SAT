name: DRNAS CORE - operator domain and CNF regression
on:
  push:
    branches: [development/drnas-core]
    paths: ['core/**', '.github/workflows/core-operator.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libboost-dev
      - name: Native build
        run: bash core/build.sh
      - name: Operator exact proofs and negative controls
        run: python3 core/operator_tests.py
      - name: Sparse symbolic operator proofs and controls
        run: python3 core/symbolic_tests.py
      - name: Learned rule memory transfer and controls
        run: python3 core/rule_memory_tests.py
      - name: Audited rule transfer and finite Z2 gauge controls
        run: python3 core/operator_rule_tests.py
      - name: Composed mathematical rule transfer
        run: python3 core/composed_rule_tests.py
      - name: Recursive algebraic rule closure and transfer
        run: python3 core/recursive_rule_tests.py
      - name: Matrix-free commuting projector gaps (YM8)
        run: python3 core/symbolic_gap_tests.py
      - name: Noncommuting product-ground comparison (YM9)
        run: python3 core/noncommuting_gap_tests.py
      - name: Contextual rule utility feedback and controls
        run: python3 core/rule_utility_tests.py
      - name: Existing CNF regression
        run: python3 core/tests.py
