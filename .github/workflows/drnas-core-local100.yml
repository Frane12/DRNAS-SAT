          github-token: ${{ github.token }}
          path: core/results/failed-feedback-input
      - name: Replay nine unresolved CNFs from the preceding fresh panel
        run: |
          cd core
          python3 -u - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,time
          src=pathlib.Path('results/failed-feedback-input/feedback100').resolve()
          out=pathlib.Path('results/local-replay9').resolve()
          out.mkdir(parents=True,exist_ok=False)
          cases={r['id']:r for r in json.loads((src/'manifest.json').read_text())}
          ids=['F000','F019','F048','F053','F054','F065','F076','F082','F094']
          cpus=sorted(os.sched_getaffinity(0));os.sched_setaffinity(0,{cpus[0]})
          rows=[]
          for cid in ids:
              case=cases[cid];cnf=src/case['path']
              assert hashlib.sha256(cnf.read_bytes()).hexdigest()==case['sha256']
              for mode in ['staged','feedback','local']:
                  cert=out/f'{cid}.{mode}.cert'
                  env=dict(os.environ,DRNAS_SCHEDULE=mode,DRNAS_PROFILE='1')
                  row={'id':cid,'mode':mode,'status':'UNKNOWN','sha256':case['sha256']}
                  t=time.monotonic()
                  try:
                      p=subprocess.run(['bin/drnas-core',cnf,cert,'5','default'],capture_output=True,text=True,timeout=5.1,env=env)
                      row['returncode']=p.returncode
                      (out/f'{cid}.{mode}.log').write_text(p.stdout+'\n'+p.stderr)
                      if time.monotonic()-t>5.05:row['status']='TIMEOUT'
                      elif p.returncode not in (0,10,20):row['status']='ERROR'
