          selector_patches=[["int discover(){","int discover(double fraction=.50,double maximum=.6,bool responsive=false){"],["auto stop=budget(.50,.6);","auto stop=budget(fraction,maximum);"],["bool good=toolbox::satisfied(work,m)||toolbox::repair(f.n,work,m,part(.35),repair_flips);","double repair_fraction=.35;\n                if(responsive){\n                    int bad=0;double expected=0;\n                    for(const C& c:work){\n                        bool ok=false;for(int l:c)if(toolbox::value(m,l)==1){ok=true;break;}\n                        bad+=!ok;expected+=std::ldexp(1.0,-int(min<size_t>(c.size(),1024)));\n                    }\n                    double ratio=bad/max(1.0,expected);\n                    repair_fraction=ratio<.65?.55:ratio>1.10?.12:.35;\n                    std::fprintf(stderr,\"SELECTOR residual_bad=%d expected=%.6f repair_fraction=%.6f\\n\",bad,expected,repair_fraction);\n                }\n                bool good=toolbox::satisfied(work,m)||toolbox::repair(f.n,work,m,part(repair_fraction),repair_flips);"],["        if(eligible&&schedule==\"early\"){","        if(eligible&&schedule==\"selector\"){\n            // CNF-only opportunity estimate: resolution pair count, occurrence\n            // asymmetry and quality of a sign-balanced seed. No family labels.\n            vector<int> pos(original.n+1),neg(original.n+1);\n            for(const C& c:all)for(int l:c)(l>0?pos[l]:neg[-l])++;\n            int live=0,cheap=0;double skew=0;\n            for(int v=1;v<=original.n;++v)if(pos[v]+neg[v]){\n                ++live;cheap+=(1LL*pos[v]*neg[v]<=64);\n                skew+=double(abs(pos[v]-neg[v]))/(pos[v]+neg[v]);\n            }\n            double opportunity=double(cheap)/max(1,live);\n            double imbalance=skew/max(1,live);\n            double expected_bad=0;int bad=0;\n            toolbox::Model guess(original.n+1,0);\n            for(int v=1;v<=original.n;++v)guess[v]=pos[v]>neg[v];\n            for(const C& c:all){\n                bool ok=false;for(int l:c)if((guess[abs(l)]!=0)==(l>0)){ok=true;break;}\n                bad+=!ok;expected_bad+=std::ldexp(1.0,-int(min<size_t>(c.size(),1024)));\n            }\n            double seed_ratio=bad/max(1.0,expected_bad);\n            // Heuristic, frozen before the new panel. Favor constructive\n            // projection when a seed or cheap pivots offer evidence of progress.\n            bool projection_first=seed_ratio<.80 || (opportunity>.35 && imbalance>.12);\n            std::fprintf(stderr,\"SELECTOR initial=%s cheap=%.6f imbalance=%.6f seed_ratio=%.6f\\n\",\n                         projection_first?\"projection\":\"fusion\",opportunity,imbalance,seed_ratio);\n            if(!projection_first){\n                auto before=fusion_kernel::stats.split_nodes;\n                rc=fusion(.16,.40);if(rc)return rc;\n                auto nodes=fusion_kernel::stats.split_nodes-before;\n                std::fprintf(stderr,\"SELECTOR fusion_probe_nodes=%lld\\n\",(long long)nodes);\n            }\n            if(left()>.08){\n                auto prev_shared=shared;auto prev_proof=ledger.size();\n                rc=discover(.50,projection_first?.6:.35,true);if(rc)return rc;\n                double projected=double(projected_variables)/max(1,live);\n                double yield=double(shared-prev_shared)/max<size_t>(1,ledger.size()-prev_proof);\n                // Spend more of the remaining budget on FUSION when discovery\n                // produced little reduction or little reusable evidence.\n                double allocation=(projected>.15||yield>.12)?.52:.68;\n                std::fprintf(stderr,\"SELECTOR projected=%.6f yield=%.6f fusion_fraction=%.6f\\n\",projected,yield,allocation);\n                if(left()>.08){rc=fusion(allocation);if(rc)return rc;}\n            }\n            return general();\n        }\n        if(eligible&&schedule==\"early\"){"]]
