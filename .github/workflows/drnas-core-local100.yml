name: DRNAS CORE - exact local repair 100
on:
  push:
    branches: [development/drnas-core]
    paths: ['.github/workflows/drnas-core-local100.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  local:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 012315d0a62443667aad69fe0dd42c72dd375630
      - name: Build unmodified baseline
        run: |
          bash core/build.sh
          cp core/bin/drnas-core core/bin/drnas-core-baseline
      - name: Build scheduler candidates and check soundness
