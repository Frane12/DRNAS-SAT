          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('core/core.cpp')
          s=p.read_text()
          patches=[["struct Core {","// Diagnostic-only scoped timers. Disabled unless DRNAS_PROFILE is set.\nstruct ProfileScope {\n    const char* name; Time started; bool enabled;\n    explicit ProfileScope(const char* n):name(n),started(Clock::now()),enabled(std::getenv(\"DRNAS_PROFILE\")!=nullptr){\n        if(enabled){std::fprintf(stderr,\"PROFILE_BEGIN %s\\n\",name);std::fflush(stderr);}\n    }\n    ~ProfileScope(){\n        if(enabled){std::fprintf(stderr,\"PROFILE_END %s %.9f\\n\",name,chrono::duration<double>(Clock::now()-started).count());std::fflush(stderr);}\n    }\n};\ntemplate<class Fn> static auto profiled(const char* name,Fn&& fn){\n    ProfileScope scope(name);return fn();\n}\nstruct Core {"],["int relations(){","int relations(){\n        ProfileScope scope(\"relations\");"],["int fusion(){","int fusion(){\n        ProfileScope scope(\"fusion\");"],["int discover(){","int discover(){\n        ProfileScope scope(\"discovery\");"],["int general(){","int general(){\n        ProfileScope scope(\"general\");"],["bool absorb(const F& additions,const F& messages,Time until){","bool absorb(const F& additions,const F& messages,Time until){\n        ProfileScope scope(\"rup_absorb\");"],["pcmax::math4::xor_unit(original.cs,original.n,hash.str(),min({left(),.25,seconds*.08}),&seed)","profiled(\"gf2\",[&](){return pcmax::math4::xor_unit(original.cs,original.n,hash.str(),min({left(),.25,seconds*.08}),&seed);})"],["pcmax::analyze_clause_hall(original.cs,original.n,hash.str(),opts)","profiled(\"hall\",[&](){return pcmax::analyze_clause_hall(original.cs,original.n,hash.str(),opts);})"],["toolbox::finite3_model(original,m,budget(.20,2.5),algebra)","profiled(\"gf3\",[&](){return toolbox::finite3_model(original,m,budget(.20,2.5),algebra);})"],["toolbox::circuit_affine_model(original,root,m,budget(.68),algebra)","profiled(\"affine_word\",[&](){return toolbox::circuit_affine_model(original,root,m,budget(.68),algebra);})"],["toolbox::cooperate(original.n,active,fixed,p,budget(.18,.7),cases,unified,4)","profiled(\"relation_cooperate\",[&](){return toolbox::cooperate(original.n,active,fixed,p,budget(.18,.7),cases,unified,4);})"],["toolbox::factor_stage(original,active,fixed,p,budget(.12,.35),factors,2)","profiled(\"relation_factor\",[&](){return toolbox::factor_stage(original,active,fixed,p,budget(.12,.35),factors,2);})"],["fusion_kernel::fusion_solve(f,budget(.52),true,0)","profiled(\"fusion_kernel\",[&](){return fusion_kernel::fusion_solve(f,budget(.52),true,0);})"]]
          for old,new in patches:
              assert s.count(old)==1,old
              s=s.replace(old,new,1)
          scheduler_patches=[["int fusion(){","int fusion(double fraction=.52,double maximum=1e30){"],["fusion_kernel::fusion_solve(f,budget(.52),true,0)","fusion_kernel::fusion_solve(f,budget(fraction,maximum),true,0)"],["        int rc=relations();if(rc)return rc;\n        rc=fusion();if(rc)return rc;\n        rc=discover();if(rc)return rc;\n        return general();","        int rc=relations();if(rc)return rc;\n        const char* raw_schedule=std::getenv(\"DRNAS_SCHEDULE\");\n        string schedule=raw_schedule?raw_schedule:\"legacy\";\n        bool eligible=!no_share&&original.n<=1500&&all.size()<=10000&&left()>.12;\n        if(eligible&&schedule==\"early\"){\n            rc=discover();if(rc)return rc;\n            rc=fusion(.62);if(rc)return rc;\n            return general();\n        }\n        if(eligible&&schedule==\"staged\"){\n            // First bounded structural attempt; do not persist incomplete search.\n            rc=fusion(.16,.40);if(rc)return rc;\n            rc=discover();if(rc)return rc;\n            // Use the checked ledger and remaining budget; restart FUSION.\n            // Reserve time for GENERAL even if the first methods fail.\n            if(left()>.08){rc=fusion(.62);if(rc)return rc;}\n            return general();\n        }\n        rc=fusion();if(rc)return rc;\n        rc=discover();if(rc)return rc;\n        return general();"]]
          for old,new in scheduler_patches:
