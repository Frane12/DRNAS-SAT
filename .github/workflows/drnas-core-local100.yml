          feedback_patches=[["int discover(double fraction=.50,double maximum=.6,bool responsive=false){","    // Repair on a private canonical residual. Keep exact clause membership\n    // and lock root-implied variables; no incremental swap/pop assumptions.\n    struct RepairProgress { int initial=0,best=0,windows=0,stalls=0; uint64_t moves=0; double elapsed=0; };\n    RepairProgress live_repair;\n    bool repair_feedback(int n,const F& input,toolbox::Model& m,const toolbox::Model& fixed,Time until){\n        live_repair=RepairProgress{};\n        const auto start=Clock::now();\n        F cs;cs.reserve(input.size());\n        for(C c:input){\n            if(!toolbox::normalize(c))continue;\n            if(c.empty())return false;\n            cs.push_back(std::move(c));\n        }\n        for(int v=1;v<=n;++v){\n            if(fixed.at(v)>=0)m.at(v)=fixed[v];\n            else if(m.at(v)<0)m[v]=0;\n        }\n        vector<vector<int>> occ(n+1);\n        for(int i=0;i<int(cs.size());++i)for(int l:cs[i])occ.at(abs(l)).push_back(i);\n        auto sat_count=[&](int i){\n            int count=0;\n            for(int l:cs.at(i))count+=toolbox::value(m,l)==1;\n            return count;\n        };\n        vector<int> counts(cs.size());\n        set<int> bad;\n        for(int i=0;i<int(cs.size());++i){\n            counts[i]=sat_count(i);\n            if(!counts[i])bad.insert(i);\n        }\n        live_repair.initial=live_repair.best=int(bad.size());\n        toolbox::Model best_model=m;\n        std::mt19937 rng(20310719);\n        auto pick=[&](size_t k){return std::uniform_int_distribution<size_t>(0,k-1)(rng);};\n        const uint64_t window=uint64_t(max(256,min(8192,24*n)));\n        const uint64_t max_moves=min<uint64_t>(1000000,max<uint64_t>(4096,3000ULL*uint64_t(n)));\n        int previous=live_repair.best;\n        for(uint64_t step=0;step<max_moves&&!bad.empty();++step){\n            if((step&63)==0&&Clock::now()>=until)break;\n            auto it=bad.begin();std::advance(it,pick(bad.size()));\n            const C& c=cs.at(*it);\n            C choices;\n            for(int l:c)if(fixed.at(abs(l))<0&&toolbox::value(m,l)==0)choices.push_back(l);\n            if(choices.empty())break; // cannot repair under this fixed assignment\n            int chosen=choices.front(),loss_best=INT_MAX;size_t ties=0;\n            if(rng()%100<12)chosen=choices.at(pick(choices.size()));\n            else for(int l:choices){\n                int loss=0;\n                for(int i:occ.at(abs(l))){\n                    if(counts.at(i)==1 && std::find(cs[i].begin(),cs[i].end(),-l)!=cs[i].end())++loss;\n                    if(loss>loss_best)break;\n                }\n                if(loss<loss_best){loss_best=loss;chosen=l;ties=1;}\n                else if(loss==loss_best&&pick(++ties)==0)chosen=l;\n            }\n            int v=abs(chosen);m.at(v)=chosen>0;\n            for(int i:occ.at(v)){\n                counts.at(i)=sat_count(i);\n                if(counts[i])bad.erase(i);else bad.insert(i);\n            }\n            ++live_repair.moves;++repair_flips;\n            if(int(bad.size())<live_repair.best){live_repair.best=int(bad.size());best_model=m;}\n            if((step+1)%window==0){\n                ++live_repair.windows;\n                if(live_repair.best<previous){previous=live_repair.best;live_repair.stalls=0;}\n                else ++live_repair.stalls;\n                if(live_repair.stalls>=(live_repair.best<=2?6:3))break;\n            }\n        }\n        m=std::move(best_model);\n        live_repair.elapsed=chrono::duration<double>(Clock::now()-start).count();\n        std::fprintf(stderr,\"SELECTOR feedback_repair initial=%d best=%d windows=%d stalls=%d moves=%llu elapsed=%.9f\\n\",\n            live_repair.initial,live_repair.best,live_repair.windows,live_repair.stalls,\n            (unsigned long long)live_repair.moves,live_repair.elapsed);\n        return live_repair.best==0&&toolbox::satisfied(input,m);\n    }\n    int discover(double fraction=.50,double maximum=.6,int responsive=0){"],["if(responsive){","if(responsive==1){"],["bool good=toolbox::satisfied(work,m)||toolbox::repair(f.n,work,m,part(repair_fraction),repair_flips);","bool good=toolbox::satisfied(work,m);\n                if(!good){\n                    if(responsive==2){\n                        good=repair_feedback(f.n,work,m,fixed,part(.60));\n                        // If the measured local attempt did not finish but is\n                        // close to a model, allow the original repair path too.\n                        if(!good&&live_repair.best<=2&&Clock::now()<stop)\n                            good=toolbox::repair(f.n,work,m,part(.25),repair_flips);\n                    }else good=toolbox::repair(f.n,work,m,part(repair_fraction),repair_flips);\n                }"],["        if(eligible&&schedule==\"selector\"){","        if(eligible&&schedule==\"feedback\"){\n            // Use the twice-validated staged schedule as the safety baseline.\n            rc=fusion(.16,.40);if(rc)return rc;\n            auto shared_before=shared;auto proof_before=ledger.size();\n            rc=discover(.50,.6,2);if(rc)return rc;\n            // Real progress, not the formula family: residual improvement,\n            // projected fraction and checked-message yield inform the remainder.\n            double gain=double(live_repair.initial-live_repair.best)/max(1,live_repair.initial);\n            double projected=double(projected_variables)/max(1,original.n);\n            double reuse=double(shared-shared_before)/max<size_t>(1,ledger.size()-proof_before);\n            // Give GENERAL a meaningful share when repair plateaus and little\n            // certified information was extracted; otherwise favor FUSION.\n            double fraction=(live_repair.stalls>=3&&gain<.20&&projected<.10&&reuse<.10)?.48:.62;\n            std::fprintf(stderr,\"SELECTOR feedback gain=%.6f projected=%.6f reuse=%.6f fusion_fraction=%.6f\\n\",gain,projected,reuse,fraction);\n            if(left()>.08){rc=fusion(fraction);if(rc)return rc;}\n            return general();\n        }\n        if(eligible&&schedule==\"selector\"){"],["                if(good){\n                    for(int v=1;v<=f.n;++v)if(fixed[v]>=0)m[v]=fixed[v];\n                    projection.reconstruct(m);\n                    for(int v=1;v<=f.n;++v)if(fixed[v]>=0)m[v]=fixed[v];\n                    if(model(m,\"unified_projection_model\"))return 10;\n                }","                if(good){\n                    for(int v=1;v<=f.n;++v)if(fixed[v]>=0)m[v]=fixed[v];\n                    if(responsive==2){\n                        // A residual witness is only a candidate, not a proof.\n                        // Discard failed lifts and continue other checked methods.\n                        bool lifted=toolbox::satisfied(work,m);\n                        if(lifted)try{projection.reconstruct(m);}\n                        catch(const std::logic_error& e){\n                            lifted=false;\n                            std::fprintf(stderr,\"SELECTOR rejected_lift %s\\n\",e.what());\n                        }\n                        if(lifted){\n                            for(int v=1;v<=f.n;++v)if(fixed[v]>=0)m[v]=fixed[v];\n                            if(model(m,\"unified_projection_model\"))return 10;\n                        }\n                        std::fprintf(stderr,\"SELECTOR rejected_candidate continuing\\n\");\n                    }else{\n                        projection.reconstruct(m);\n                        for(int v=1;v<=f.n;++v)if(fixed[v]>=0)m[v]=fixed[v];\n                        if(model(m,\"unified_projection_model\"))return 10;\n                    }\n                }"]]
          for old,new in feedback_patches:
              assert s.count(old)==1,old
              s=s.replace(old,new,1)
          local_patches=[["    int discover(double fraction=.50,double maximum=.6,int responsive=0){","    // Exact conditional truth table on a bounded set of repair variables.\n    // All other variables are frozen to a candidate model, not asserted facts.\n    // Empty table means only that this particular conditional repair failed.\n    bool local_exact(int n,const F& input,toolbox::Model& m,const toolbox::Model& fixed,Time until){\n        F cs;cs.reserve(input.size());\n        for(C c:input){if(toolbox::normalize(c))cs.push_back(std::move(c));}\n        toolbox::Model seed=m;\n        for(int v=1;v<=n;++v)if(fixed.at(v)>=0)seed.at(v)=fixed[v];\n        vector<int> vars;vector<int> loc(n+1,-1);\n        auto add=[&](int v){if(fixed.at(v)<0&&loc.at(v)<0){loc[v]=int(vars.size());vars.push_back(v);}};\n        int initial_bad=0;\n        for(const C& c:cs){\n            bool ok=false;for(int l:c)if(toolbox::value(seed,l)==1){ok=true;break;}\n            if(!ok){++initial_bad;for(int l:c)add(abs(l));}\n        }\n        if(initial_bad==0){m=seed;return true;}\n        if(initial_bad>8||vars.empty()||vars.size()>20)return false;\n        // Grow the region through constraints that can lose their only\n        // satisfying boundary literals. Prefer variables that can repair\n        // such constraints, without modifying any root-implied assignment.\n        auto grow=[&](int target){\n            while(int(vars.size())<target&&Clock::now()<until){\n                vector<int> score(n+1,0);\n                for(const C& c:cs){\n                    int inside_true=0,outside_true=0,inside=0;\n                    for(int l:c){\n                        bool in=loc[abs(l)]>=0;inside+=in;\n                        if(toolbox::value(seed,l)==1){if(in)++inside_true;else ++outside_true;}\n                    }\n                    if(!inside||outside_true)continue;\n                    int w=inside_true==1?16:inside_true==0?8:3;\n                    for(int l:c)if(loc[abs(l)]<0&&fixed[abs(l)]<0)score[abs(l)]+=w;\n                }\n                int best=0;for(int v=1;v<=n;++v)if(score[v]>0&&(!best||score[v]>score[best]))best=v;\n                if(!best)break;add(best);\n            }\n        };\n        uint64_t pattern[6]={};\n        for(unsigned j=0;j<6;++j)for(unsigned bit=0;bit<64;++bit)if((bit>>j)&1u)pattern[j]|=uint64_t(1)<<bit;\n        int attempts=0,previous=-1;\n        for(int width:{8,12,16,20}){\n            if(Clock::now()>=until)break;\n            if(width<int(vars.size()))continue;\n            grow(width);\n            int k=int(vars.size());if(k==previous)continue;previous=k;\n            if(k<=0||k>20)break;\n            vector<pair<uint32_t,uint32_t>> clauses;\n            bool blocked=false;\n            for(const C& c:cs){\n                if(Clock::now()>=until)return false;\n                bool outside=false;uint32_t positive=0,negative=0;\n                for(int l:c){\n                    int j=loc[abs(l)];bool val=toolbox::value(seed,l)==1;\n                    if(j<0){if(val){outside=true;break;}}\n                    else if(val)negative|=uint32_t(1)<<j;\n                    else positive|=uint32_t(1)<<j;\n                }\n                if(outside)continue;\n                if(!(positive|negative)){blocked=true;break;}\n                clauses.emplace_back(positive,negative);\n            }\n            if(blocked)continue;\n            stable_sort(clauses.begin(),clauses.end(),[](const auto& a,const auto& b){\n                return __builtin_popcount(a.first|a.second)<__builtin_popcount(b.first|b.second);\n            });\n            ++attempts;\n            uint32_t total=uint32_t(1)<<k;uint64_t scanned=0;\n            for(uint32_t base=0;base<total;base+=64){\n                if(Clock::now()>=until)break;\n                uint64_t allowed=total<64?(uint64_t(1)<<total)-1:~uint64_t(0);\n                uint64_t bits[20];\n                for(int j=0;j<k;++j)bits[j]=j<6?pattern[j]:((base>>j)&1u?~uint64_t(0):0);\n                for(auto [p,q]:clauses){\n                    uint64_t sat=0;\n                    while(p){unsigned j=__builtin_ctz(p);p&=p-1;sat|=bits[j];}\n                    while(q){unsigned j=__builtin_ctz(q);q&=q-1;sat|=~bits[j];}\n                    allowed&=sat;if(!allowed)break;\n                }\n                scanned+=min<uint32_t>(64,total-base);\n                if(allowed){\n                    uint32_t flip=base+unsigned(__builtin_ctzll(allowed));\n                    toolbox::Model candidate=seed;\n                    for(int j=0;j<k;++j)if((flip>>j)&1u)candidate[vars[j]]^=1;\n                    if(!toolbox::satisfied(input,candidate))throw std::logic_error(\"local truth-table invariant\");\n                    m=std::move(candidate);\n                    std::fprintf(stderr,\"SELECTOR local_exact SAT bad=%d width=%d clauses=%zu scanned=%llu attempts=%d\\n\",\n                        initial_bad,k,clauses.size(),(unsigned long long)scanned,attempts);\n                    return true;\n                }\n            }\n            std::fprintf(stderr,\"SELECTOR local_exact %s bad=%d width=%d clauses=%zu scanned=%llu attempts=%d\\n\",\n                scanned==total?\"CONDITIONAL_EMPTY\":\"LIMIT\",initial_bad,k,clauses.size(),(unsigned long long)scanned,attempts);\n        }\n        return false;\n    }\n    int discover(double fraction=.50,double maximum=.6,int responsive=0){"],["                    if(responsive==2){\n                        good=repair_feedback(f.n,work,m,fixed,part(.60));","                    if(responsive>=2){\n                        good=repair_feedback(f.n,work,m,fixed,part(responsive==3?.45:.60));\n                        if(responsive==3&&!good&&live_repair.best>0&&live_repair.best<=8&&Clock::now()<stop)\n                            good=local_exact(f.n,work,m,fixed,min(part(.45),toolbox::after(.15)));"],["                    if(responsive==2){\n                        // A residual witness","                    if(responsive>=2){\n                        // A residual witness"],["        if(eligible&&schedule==\"feedback\"){","        if(eligible&&(schedule==\"feedback\"||schedule==\"local\")){"],["rc=discover(.50,.6,2);if(rc)return rc;","rc=discover(.50,.6,schedule==\"local\"?3:2);if(rc)return rc;"]]
          for old,new in local_patches:
              assert s.count(old)==1,old
