name: DRNAS UNIFIED6 - learned utility and chained proof transfer
on:
  push:
    branches: [experiment/drnas-unified6-utility-learning-20261125]
    paths:
      - 'research/toolbox20_native/unified6*'
      - '.github/workflows/drnas-unified6.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build frozen UNIFIED4 and independent checker
        run: |
          set -eux
          mkdir -p bin
          c++ -std=c++20 -O3 -DNDEBUG research/toolbox20_native/unified4.cpp -lcrypto -o bin/unified4
          git clone https://github.com/marijnheule/drat-trim.git /tmp/drat
          git -C /tmp/drat checkout 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          cc -O2 -std=gnu99 /tmp/drat/drat-trim.c -o bin/drat-trim
          python3 -m py_compile research/toolbox20_native/unified6_utility.py
      - name: Train, calibrate utility, freeze, paired blind transfer
        run: |
          python3 -u research/toolbox20_native/unified6_utility.py --solver bin/unified4 --checker bin/drat-trim --out u6-results --freeze "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified6-utility-learning
          path: u6-results/
          if-no-files-found: warn
