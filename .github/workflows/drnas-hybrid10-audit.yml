name: DRNAS HYBRID10 independent VeriPB three-theory audit
on:
  push:
    branches:
      - experiment/hybrid10-veripb-three-theory-20261120
    paths:
      - research/hybrid10/**
      - .github/workflows/drnas-hybrid10-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  veripb-source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Generate exactly pinned hybrid9 graph inputs
        run: python3 research/hybrid10/generate_cases.py /tmp/hybrid10
      - name: Install independent official VeriPB 3.0.2
        shell: bash
        run: |
          set -euo pipefail
          cargo install veripb --version 3.0.2 --locked
          veripb --help | head -12
      - name: Source-bound hybrid proof generation and strict external verification
        shell: bash
        run: |
          set -euo pipefail
          for n in 4 6 8; do
            python3 research/hybrid10/emit_veripb_three_theory.py --cnf "/tmp/hybrid10/graph$n.cnf" --output "/tmp/hybrid10/graph$n.pbp" --meta "/tmp/hybrid10/graph$n.json"
            veripb --cnf "/tmp/hybrid10/graph$n.cnf" "/tmp/hybrid10/graph$n.pbp" | tee "/tmp/hybrid10/graph$n-veripb.log"
            grep -q 's VERIFIED UNSATISFIABLE' "/tmp/hybrid10/graph$n-veripb.log"
            echo "EXTERNALLY_VERIFIED n=$n"
          done
      - name: Fail closed on source mutations and SAT controls
        shell: bash
        run: |
          set -euo pipefail
          python3 research/hybrid10/emit_veripb_three_theory.py --cnf /tmp/hybrid10/graph6-sat.cnf --output /tmp/hybrid10/bad.pbp && exit 1 || status=$?
          test "$status" -eq 2
          test ! -f /tmp/hybrid10/bad.pbp
          python3 - <<'PY'
          from pathlib import Path
          orig=Path('/tmp/hybrid10/graph6.cnf').read_text()
          rows=orig.splitlines()
          for key,check in [('amo',lambda s:s=='-1 -2 0'),('equality',lambda s:s=='-14 1 0')]:
              new=rows.copy()
              idx=next(i for i,s in enumerate(new) if check(s))
              del new[idx]
              parts=new[0].split();parts[3]=str(int(parts[3])-1)
              new[0]=' '.join(parts)
              Path('/tmp/hybrid10/removed-'+key+'.cnf').write_text('\n'.join(new)+'\n')
          PY
          for mode in amo equality; do
            if python3 research/hybrid10/emit_veripb_three_theory.py --cnf "/tmp/hybrid10/removed-$mode.cnf" --output "/tmp/hybrid10/removed-$mode.pbp"; then
              echo "INVALID: mutated source accepted" >&2
              exit 1
            fi
            test ! -f "/tmp/hybrid10/removed-$mode.pbp"
            echo "SOURCE_MUTATION_REJECTED $mode"
          done

      - name: Extended source scaling, shuffled clauses and independent VeriPB
        shell: bash
        run: |
          set -euo pipefail
          python3 research/hybrid10/make_extended.py /tmp/h10extended | tee /tmp/h10-extended-sources.log
          grep -q SAT12_EXPLICIT_MODEL_VERIFIED /tmp/h10-extended-sources.log
          for input in /tmp/h10extended/graph*.cnf /tmp/h10extended/perm*.cnf; do
            stem=$(echo "$input" | sed 's/\.cnf$//')
            python3 research/hybrid10/emit_veripb_three_theory.py --cnf "$input" --output "$stem.pbp" --meta "$stem.json"
            veripb --cnf "$input" "$stem.pbp" | tee "$stem.log"
            grep -q 's VERIFIED UNSATISFIABLE' "$stem.log"
            python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));n=d["one_hot_size"];s=sum(d["steps"].values());assert s==52*n+3,(n,s);print("EXTERNALLY_VERIFIED",sys.argv[1],"n",n,"steps",s,"bytes",d["proof_bytes"])' "$stem.json"
          done
          for name in sat12 missing_xor_clause; do
            if python3 research/hybrid10/emit_veripb_three_theory.py --cnf "/tmp/h10extended/$name.cnf" --output "/tmp/h10extended/$name.pbp"; then
              echo "UNSOUND: proof generator accepted SAT / modified source" >&2
              exit 1
            fi
            test ! -f "/tmp/h10extended/$name.pbp"
            echo "NEGATIVE_REJECTED $name"
          done

      - name: Verify distinct 3-regular graph topologies without generator labels
        shell: bash
        run: |
          set -euo pipefail
          python3 research/hybrid10/graph_topology.py /tmp/h10cubic | tee /tmp/h10cubic-generate.log
          grep -q CUBIC_SAT_MODEL_VERIFIED /tmp/h10cubic-generate.log
          for src in /tmp/h10cubic/cubic*seed*.cnf; do
            stem=$(echo "$src" | sed 's/\.cnf$//')
            python3 research/hybrid10/emit_veripb_three_theory.py --cnf "$src" --output "$stem.pbp" --meta "$stem.json"
            veripb --cnf "$src" "$stem.pbp" | tee "$stem.log"
            grep -q 's VERIFIED UNSATISFIABLE' "$stem.log"
            python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));n=d["one_hot_size"];s=sum(d["steps"].values());assert s==52*n+3;print("TOPOLOGY_VERIFIED",sys.argv[1],"n",n,"steps",s,"bytes",d["proof_bytes"])' "$stem.json"
          done
          if python3 research/hybrid10/emit_veripb_three_theory.py --cnf /tmp/h10cubic/cubic12_sat_control.cnf --output /tmp/h10cubic/false.pbp; then
            echo 'UNSOUND: SAT control erroneously accepted' >&2
            exit 1
          fi
          test ! -f /tmp/h10cubic/false.pbp
          echo CUBIC_SAT_CONTROL_REJECTED
      - name: Reject out-of-family original DRNAS SAT formulas
        shell: bash
        run: |
          set -euo pipefail
          for input in evidence/xor234-grid5/original.cnf evidence/ipg7b-petersen/original.cnf evidence/graph-k11/original.cnf evidence/pcmax-weighted2/05/original.cnf; do
            if python3 research/hybrid10/emit_veripb_three_theory.py --cnf "$input" --output /tmp/out-of-family.pbp; then
              echo "OUT_OF_FAMILY_FALSE_HIT $input" >&2
              exit 1
            fi
            test ! -f /tmp/out-of-family.pbp
            echo "OUT_OF_FAMILY_UNKNOWN $input"
          done
