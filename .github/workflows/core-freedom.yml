name: DRNAS CORE - freedom paired pilot
on:
  push:
    branches: [development/drnas-core]
    paths:
      - 'core/core.cpp'
      - 'core/run.py'
      - 'core/freedom_tests.py'
      - '.github/workflows/core-freedom.yml'
  workflow_dispatch:
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libboost-dev
      - name: Build native CORE
        run: bash core/build.sh
      - name: Paired truth-table validation
        run: |
          set -o pipefail
          python3 -u core/freedom_tests.py | tee freedom-results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-freedom-results
          path: freedom-results.jsonl
