name: DRNAS CORE - YM28 dual norm bootstrap
on:
  push:
    branches: [development/drnas-core]
    paths: ['core/gauge_dual_norm*', 'core/operator.hpp', 'core/operator_verify.py', '.github/workflows/core-ym28.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libboost-dev
      - name: Build CORE
        run: bash core/build.sh
      - name: Dual norm certificates and previous-range controls
        run: python3 core/gauge_dual_norm_tests.py
