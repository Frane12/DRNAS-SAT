name: DRNAS ATLAS18 generalized Hall subset and proof fact bus
on:
  push:
    branches:
      - experiment/atlas18-rup-hall-proofbus-20261124
    paths:
      - .github/workflows/atlas18-subset-hall-proofbus.yml
      - research/atlas18_probe/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strictly-source-verified:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated ATLAS18 branch
        uses: actions/checkout@v4
      - name: Preflight frozen algorithm and exact original source cohort
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/atlas18_probe/{hall_subset,router,test}.py
          python3 -m py_compile research/atlas17_probe/freeze.py
          sha256sum research/atlas18_probe/{hall_subset,router,test}.py > atlas18-module-sha256.txt
          git rev-parse HEAD > atlas18-source-commit.txt
          lscpu > atlas18-runner-cpu.txt
          python3 -u research/atlas17_probe/freeze.py | tee atlas18-original-source-freeze.log
          python3 - <<'PY'
          import json
          d=json.load(open('atlas17_original_inputs/manifest.json'))
          assert d['status']=='FROZEN_BEFORE_ANY_SOLVER'
          assert d['public_downloaded']==6 and d['known_retrospective']==6
          assert not d['failures'] and d['no_source_substitution']
          PY
      - name: Build existing isolated native PCMAX detector
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release > atlas18-cmake.log
          cmake --build build --target drnas-pcmax -j2 > atlas18-native-build.log
          sha256sum build/drnas-pcmax > atlas18-native-sha256.txt
      - name: Build pinned Kissat 4.0.4 and CaDiCaL 2.1.3
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch rel-4.0.4 https://github.com/arminbiere/kissat.git kissat-src
          test "$(git -C kissat-src rev-parse HEAD)" = "8af8e56f174b778aef3aa45af9f739b2a5f492c2"
          (cd kissat-src && ./configure >/dev/null && make -j2 >/dev/null)
          git clone -q --depth 1 --branch rel-2.1.3 https://github.com/arminbiere/cadical.git cadical-src
          test "$(git -C cadical-src rev-parse HEAD)" = "f13d74439a5b5c963ac5b02d05ce93a8098018b8"
          (cd cadical-src && ./configure >/dev/null && make -j2 >/dev/null)
          sha256sum kissat-src/build/kissat cadical-src/build/cadical > atlas18-reference-sha256.txt
      - name: Build pinned independent DRAT checker
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/marijnheule/drat-trim.git drat-trim-src
          (cd drat-trim-src && git checkout -q 2e3b2dc0ecf938addbd779d42877b6ed69d9a985 && make -j2 >/dev/null)
          sha256sum drat-trim-src/drat-trim > atlas18-drat-sha256.txt
      - name: Install external VeriPB v3.0.2
        shell: bash
        run: |
          set -euo pipefail
          cargo install veripb --version 3.0.2 --locked
          veripb --version > atlas18-veripb-version.txt 2>&1
      - name: Strict test on six frozen public originals, six known controls and three constructed controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -u research/atlas18_probe/test.py | tee atlas18-full-test.log
          python3 - <<'PY'
          import json
          d=json.load(open('atlas18_pilot_results/summary.json'))
          assert d['status']=='COMPLETE' and d['total_cases']==15
          assert d['public_originals']==6 and d['known_retrospective']==6
          assert d['generated_joint']==2 and d['SAT_controls']==1
          assert d['no_CDCL_fallback'] and d['external_standard_original_proofs_only']
          print('ATLAS18_PROOF_FIRST_AUDIT',json.dumps({k:v for k,v in d.items() if k!='rows'},sort_keys=True))
          PY
      - name: Preserve all original SHA and external proofs
        if: always()
        shell: bash
        run: |
          set +e
          find atlas18_pilot_results -type f -print0 2>/dev/null | xargs -0 -r sha256sum > atlas18-evidence-sha256.txt
          date -u +'%FT%TZ' > atlas18-finished-utc.txt
      - name: Upload original-sourced standard proofs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-ATLAS18-HALL-SUBSET-AND-FACTBUS-EVIDENCE
          path: |
            atlas18_pilot_results/
            atlas18-original-source-freeze.log
            atlas18-full-test.log
            atlas18-module-sha256.txt
            atlas18-source-commit.txt
            atlas18-runner-cpu.txt
            atlas18-native-sha256.txt
            atlas18-reference-sha256.txt
            atlas18-drat-sha256.txt
            atlas18-veripb-version.txt
            atlas18-evidence-sha256.txt
            atlas18-finished-utc.txt
            atlas18-cmake.log
            atlas18-native-build.log
          retention-days: 30
