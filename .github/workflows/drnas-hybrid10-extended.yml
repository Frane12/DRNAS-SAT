name: DRNAS HYBRID10 extended independent VeriPB scaling audit
on:
  push:
    branches:
      - experiment/hybrid10-veripb-three-theory-20261120
    paths:
      - research/hybrid10/**
      - .github/workflows/drnas-hybrid10-extended.yml
permissions:
  contents: read
jobs:
  extended:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate source-only holdout variants and explicit SAT model
        shell: bash
        run: |
          set -euo pipefail
          python3 research/hybrid10/make_extended.py /tmp/h10extended | tee /tmp/h10-sources.log
          grep -q SAT12_EXPLICIT_MODEL_VERIFIED /tmp/h10-sources.log
      - name: Install independently released VeriPB 3.0.2
        run: cargo install veripb --version 3.0.2 --locked
      - name: Verify 4 larger graph sources and 4 permuted ones
        shell: bash
        run: |
          set -euo pipefail
          for src in /tmp/h10extended/graph*.cnf /tmp/h10extended/perm*.cnf; do
            stem=$(echo "$src" | sed 's/\.cnf$//')
            python3 research/hybrid10/emit_veripb_three_theory.py --cnf "$src" --output "$stem.pbp" --meta "$stem.json"
            veripb --cnf "$src" "$stem.pbp" | tee "$stem-veripb.log"
            grep -q 's VERIFIED UNSATISFIABLE' "$stem-veripb.log"
            python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));n=d["one_hot_size"];s=sum(d["steps"].values());assert s==52*n+3,(n,s);print("EXTERNAL_VERIFIED",sys.argv[1],"n",n,"steps",s,"bytes",d["proof_bytes"])' "$stem.json"
          done
      - name: Fail closed on SAT control and damaged XOR row
        shell: bash
        run: |
          set -euo pipefail
          for name in sat12 missing_xor_clause; do
            if python3 research/hybrid10/emit_veripb_three_theory.py --cnf "/tmp/h10extended/$name.cnf" --output "/tmp/h10extended/$name.pbp"; then
              echo "UNSOUND generation on $name" >&2
              exit 1
            fi
            test ! -f "/tmp/h10extended/$name.pbp"
            echo "REJECTED_EXPECTED $name"
          done
