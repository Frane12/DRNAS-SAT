name: DRNAS UNIFIED1 - shared mathematical state
on:
  push:
    branches: [experiment/drnas-unified1-20261125]
    paths:
      - 'research/toolbox20_native/unified*'
      - '.github/workflows/drnas-unified1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build native integrated solver and frozen TOOLBOX20
        run: |
          set -eux
          mkdir -p bin
          c++ -std=c++20 -O3 -DNDEBUG research/toolbox20_native/unified.cpp -lcrypto -o bin/unified
          c++ -std=c++20 -O3 -DNDEBUG research/toolbox20_native/solver.cpp -lcrypto -o bin/toolbox20
          c++ -std=c++20 -O2 research/toolbox20_native/unified_kernel_test.cpp -o bin/kernel-test
          git clone https://github.com/marijnheule/drat-trim.git /tmp/drat
          git -C /tmp/drat checkout 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          cc -O2 -std=gnu99 /tmp/drat/drat-trim.c -o bin/drat-trim
      - name: Exact affine and nonlinear joins, independent RUP prefix audit
        run: |
          mkdir -p kernel-evidence
          bin/kernel-test kernel-evidence
          python3 research/toolbox20_native/unified_kernel_audit.py kernel-evidence
      - name: Exhaustive truth and proof smoke test
        run: python3 research/toolbox20_native/unified_smoke.py bin/unified bin/drat-trim
      - name: Build reference solvers
        run: |
          set -eux
          git clone https://github.com/arminbiere/kissat.git /tmp/kissat
          git -C /tmp/kissat checkout 77bc7ea68afe80751a67df8561357f193e160fb1
          (cd /tmp/kissat && ./configure && make -j2)
          cp /tmp/kissat/build/kissat bin/
          git clone https://github.com/arminbiere/cadical.git /tmp/cadical
          git -C /tmp/cadical checkout 14593f819cb242082b127396218bd60889409737
          (cd /tmp/cadical && ./configure && make -j2)
          cp /tmp/cadical/build/cadical bin/
      - name: Frozen prospective 50-case multi-family draw
        run: python3 research/toolbox20_native/unified_corpus.py corpus "$GITHUB_SHA"
      - name: Paired one logical CPU; no CDCL fallback
        run: |
          python3 research/toolbox20_native/unified_bench.py --manifest corpus/manifest.json --corpus corpus --out results --drnas bin/unified --baseline bin/toolbox20 --kissat bin/kissat --cadical bin/cadical --checker bin/drat-trim --cap 10 --reps 1
      - name: Summary and per-instance results
        if: always()
        run: |
          if test -f results/runs.csv; then cat results/runs.csv; fi
          if test -f results/summary.json; then cat results/summary.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified1-fresh50
          path: |
            kernel-evidence/
            corpus/manifest.json
            results/
          if-no-files-found: warn
