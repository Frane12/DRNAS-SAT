name: ATLAS and CORE - YM30 collective mode structure
on:
  push:
    branches: [development/drnas-core]
    paths: ['core/atlas_collective.py','core/collective*','core/YM30_COLLECTIVE_MODES.md','.github/workflows/core-ym30.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 283af5a80491d31b08250c62e91a8118cc8c20bc
          path: atlas-source
          persist-credentials: false
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libboost-dev
      - name: Build CORE
        run: bash core/build.sh
      - name: Paired collective mode certificates
        run: python3 core/collective_tests.py atlas-source
