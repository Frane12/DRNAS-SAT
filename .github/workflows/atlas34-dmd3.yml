name: ATLAS34 DMD3 sparse relation projection
on:
  push:
    branches: [experiment/atlas34-dmd3-sparse-projection]
    paths: ['.github/workflows/atlas34-dmd3.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  selftest:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Independent proof checker and exhaustive small controls
        run: |
          set -euo pipefail
          git clone https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          git -C /tmp/drat-trim checkout 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          gcc -O2 -D_GNU_SOURCE /tmp/drat-trim/drat-trim.c -o /tmp/drat-check
          python3 -m py_compile research/atlas34/*.py
          python3 -u research/atlas34/bench.py selftest controls
  paired:
    needs: selftest
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: [{"mode":"fresh","n":16,"rho":"3.5","id":"fresh-16-3.5"},{"mode":"fresh","n":24,"rho":"3.5","id":"fresh-24-3.5"},{"mode":"fresh","n":48,"rho":"3.5","id":"fresh-48-3.5"},{"mode":"fresh","n":80,"rho":"3.5","id":"fresh-80-3.5"},{"mode":"fresh","n":16,"rho":"4.26","id":"fresh-16-4.26"},{"mode":"fresh","n":24,"rho":"4.26","id":"fresh-24-4.26"},{"mode":"fresh","n":48,"rho":"4.26","id":"fresh-48-4.26"},{"mode":"fresh","n":80,"rho":"4.26","id":"fresh-80-4.26"},{"mode":"fresh","n":16,"rho":"5.0","id":"fresh-16-5.0"},{"mode":"fresh","n":24,"rho":"5.0","id":"fresh-24-5.0"},{"mode":"fresh","n":48,"rho":"5.0","id":"fresh-48-5.0"},{"mode":"fresh","n":80,"rho":"5.0","id":"fresh-80-5.0"},{"mode":"prior","n":24,"rho":"4.26","id":"prior-24-4.26"},{"mode":"prior","n":48,"rho":"4.26","id":"prior-48-4.26"},{"mode":"prior","n":24,"rho":"5.0","id":"prior-24-5.0"},{"mode":"prior","n":48,"rho":"5.0","id":"prior-48-5.0"}]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/DRNAS-SAT
          run-id: 45360211946
          github-token: ${{ github.token }}
          name: DRNAS-ATLAS22-ORIGINAL-CHACHA32-CNF-CERTIFIED-PAIRED
          path: baseline
      - name: Freeze checker and reference binaries
        run: |
          set -euo pipefail
          git clone https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          git -C /tmp/drat-trim checkout 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          gcc -O2 -D_GNU_SOURCE /tmp/drat-trim/drat-trim.c -o /tmp/drat-check
          chmod +x baseline/atlas22_artifacts/solvers/{kissat,cadical}
          sha256sum baseline/atlas22_artifacts/solvers/{kissat,cadical}
      - name: Source-only same CPU differential experiment
        run: |
          set -euo pipefail
          mkdir -p results
          cpu=$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')
          ulimit -v 6000000
          taskset -c "$cpu" python3 -u research/atlas34/bench.py '${{ matrix.mode }}' results baseline/atlas22_artifacts/solvers '${{ matrix.n }}' '${{ matrix.rho }}' | tee results/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DMD3-case-${{ matrix.id }}
          path: results/
  aggregate:
    needs: [selftest,paired]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: DMD3-case-*
          path: shards
      - name: Verified coverage and bottleneck diagnosis
        run: |
          python3 - <<'PY'
          import pathlib,json,collections
          rows=[r for p in pathlib.Path('shards').rglob('rows.json') for r in json.loads(p.read_text())]
          accepted={'MODEL_VERIFIED','STANDARD_DRAT'}
          for cohort,expected in [('fresh',36),('prior',12)]:
              for arm in ('MRC','SPARSE_FIXED','SPARSE_ADAPT','kissat','cadical'):
                  rr=[r for r in rows if r['case'].startswith(cohort+'/') and r['arm']==arm]
                  good=[r for r in rr if r['audit'] in accepted and r['status'] in ('SAT','UNSAT')]
                  strict=[r for r in good if r['e2e_s']<=30]
                  print('DMD3_SUMMARY',cohort,arm,json.dumps(dict(verified=len(good),strict=len(strict),missing=expected-len(rr),counts=dict(collections.Counter(r['status'] for r in rr)),reasons=dict(collections.Counter(r.get('reason','none') for r in rr)),max_scope=max((r.get('peak_scope',0) for r in rr),default=0),subsumed=sum(r.get('subsumed',0) for r in rr),pair_checks=sum(r.get('pair_checks',0) for r in rr))))
          by=collections.defaultdict(set)
          for r in rows:
              if r['audit'] in accepted and r['status'] in ('SAT','UNSAT'):by[r['sha']].add(r['status'])
          conflicts=[h for h,v in by.items() if len(v)>1]
          print('DMD3_CONTRADICTIONS',conflicts)
          pathlib.Path('summary.json').write_text(json.dumps(rows,indent=2))
          assert not conflicts
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: DMD3-summary
          path: summary.json
