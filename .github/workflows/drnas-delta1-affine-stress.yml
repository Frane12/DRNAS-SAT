name: DRNAS DELTA1 affine 2048 original frozen stress with independent proof

on:
  push:
    branches:
      - experiment/circuitcheck-delta1-affine-20261123
    paths:
      - 'apps/circuitcheck/delta1*.py'
      - '.github/workflows/drnas-delta1-affine-stress.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prep:
    name: SHA-freeze check original 20 RTL plus syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/DRNAS-SAT
          run-id: 45245092918
          name: circuitcheck-stress-frozen-rtl
          github-token: ${{ github.token }}
          path: frozen
      - name: Exact SHA and Python syntax
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c sources.sha256)
          python3 -m py_compile apps/circuitcheck/delta1_engine.py apps/circuitcheck/delta1.py apps/circuitcheck/delta1_verify.py apps/circuitcheck/delta1_stress.py
          python3 - <<'PY'
          import json
          m=json.load(open("frozen/manifest.json"))
          assert m["protocol"]=="CIRCUITCHECK_STRESS_FIXED_20261123"
          assert len(m["cases"])==20 and max(x["input_bits"] for x in m["cases"])==2048
          print("DELTA1_ORIGINAL_INPUTS_FROZEN",len(m["cases"]))
          PY

  stress:
    needs: prep
    name: DELTA1 single-CPU stress shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/DRNAS-SAT
          run-id: 45245092918
          name: circuitcheck-stress-frozen-rtl
          github-token: ${{ github.token }}
          path: frozen
      - name: Install Yosys and resource telemetry
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq yosys time
          yosys -V
      - name: Original RTL DELTA1 with separate replay, 30s cap, 2x
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c sources.sha256)
          python3 -u apps/circuitcheck/delta1_stress.py shard \
            --manifest frozen/manifest.json \
            --out results --shard "$SHARD" --shards 4 \
            | tee delta1-live.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta1-shard-${{ matrix.shard }}
          path: |
            results/
            delta1-live.log
          if-no-files-found: warn
          retention-days: 90

  audit:
    needs: [prep, stress]
    if: always()
    name: Complete strict audit + same-original-RTL prior baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/DRNAS-SAT
          run-id: 45245092918
          name: circuitcheck-stress-frozen-rtl
          github-token: ${{ github.token }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/DRNAS-SAT
          run-id: 45247995613
          name: DRNAS-CIRCUITCHECK-STRESS-2048-INDEPENDENT-AGGREGATE
          github-token: ${{ github.token }}
          path: old
      - uses: actions/download-artifact@v4
        with:
          pattern: delta1-shard-*
          path: combined
      - name: Match all 80 DELTA1 trials with 120 original baseline trials
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c sources.sha256)
          python3 -u apps/circuitcheck/delta1_stress.py aggregate \
            --manifest frozen/manifest.json --combined combined \
            --baseline old/stress-results.json \
            --output delta1-results.json --report DELTA1_REPORT.md
          python3 - <<'PY'
          import json
          result=json.load(open("delta1-results.json"))
          assert len(result["cases"])==20
          assert sum(len(x["trials"]) for x in result["cases"].values())==40
          assert all(s["attempts"]==40 for s in result["scores"].values())
          print("DELTA1_40_UNMODIFIED_ORIGINAL_RTL_TRIALS_AUDITED")
          PY
          cat DELTA1_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-DELTA1-AFFINE-2048-FINAL-SHA-AUDIT
          path: |
            delta1-results.json
            DELTA1_REPORT.md
            frozen/manifest.json
          if-no-files-found: warn
          retention-days: 90
