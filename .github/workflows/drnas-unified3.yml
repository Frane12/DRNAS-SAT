name: DRNAS UNIFIED3 - global relation discovery
on:
  push:
    branches: [experiment/drnas-unified3-discovery-20261125]
    paths:
      - 'research/toolbox20_native/discovery*'
      - 'research/toolbox20_native/unified3*'
      - '.github/workflows/drnas-unified3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate, frozen UNIFIED2 and checker
        run: |
          set -eux
          mkdir -p bin
          c++ -std=c++20 -O3 -DNDEBUG research/toolbox20_native/unified3.cpp -lcrypto -o bin/unified3
          c++ -std=c++20 -O3 -DNDEBUG research/toolbox20_native/unified2.cpp -lcrypto -o bin/unified2
          c++ -std=c++20 -O2 research/toolbox20_native/unified3_kernel_test.cpp -o bin/kernel-test
          git clone https://github.com/marijnheule/drat-trim.git /tmp/drat
          git -C /tmp/drat checkout 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          cc -O2 -std=gnu99 /tmp/drat/drat-trim.c -o bin/drat-trim
      - name: Independent proof prefix and exhaustive safety audit
        run: |
          mkdir -p kernel-evidence
          bin/kernel-test kernel-evidence
          python3 research/toolbox20_native/unified3_kernel_audit.py kernel-evidence
          python3 research/toolbox20_native/unified_smoke.py bin/unified3 bin/drat-trim
      - name: Build pinned competitors
        run: |
          set -eux
          git clone https://github.com/arminbiere/kissat.git /tmp/kissat
          git -C /tmp/kissat checkout 77bc7ea68afe80751a67df8561357f193e160fb1
          (cd /tmp/kissat && ./configure && make -j2)
          cp /tmp/kissat/build/kissat bin/
          git clone https://github.com/arminbiere/cadical.git /tmp/cadical
          git -C /tmp/cadical checkout 14593f819cb242082b127396218bd60889409737
          (cd /tmp/cadical && ./configure && make -j2)
          cp /tmp/cadical/build/cadical bin/
      - name: Exact replay 110 and prospective draw 50
        run: python3 research/toolbox20_native/unified3_corpus.py corpus "$GITHUB_SHA"
      - name: Paired one logical CPU, no CDCL fallback
        run: |
          python3 research/toolbox20_native/unified3_bench.py --manifest corpus/manifest.json --corpus corpus --out results --drnas bin/unified3 --baseline bin/unified2 --kissat bin/kissat --cadical bin/cadical --checker bin/drat-trim --cap 10 --reps 1
      - name: Per-instance and aggregate evidence
        if: always()
        run: |
          if test -f results/runs.csv; then cat results/runs.csv; fi
          if test -f results/summary.json; then cat results/summary.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified3-replay110-fresh50
          path: |
            kernel-evidence/
            corpus/manifest.json
            results/
          if-no-files-found: warn
