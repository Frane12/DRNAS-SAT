name: DRNAS CORE - REGIONAL1 decomposition
on:
  push:
    branches: [development/drnas-core]
    paths:
      - 'core/regional.hpp'
      - 'core/regional_tests.py'
      - '.github/workflows/core-regional.yml'
  workflow_dispatch:
jobs:
  regional:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libboost-dev
      - name: Build native CORE
        run: bash core/build.sh
      - name: Independent regional validation
        run: |
          set -o pipefail
          ulimit -v 4194304
          python3 -u core/regional_tests.py | tee regional-results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-regional-results
          path: regional-results.jsonl
