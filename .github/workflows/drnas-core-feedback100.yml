name: DRNAS CORE - live feedback 100
on:
  push:
    branches: [development/drnas-core]
    paths: ['.github/workflows/drnas-core-feedback100.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 012315d0a62443667aad69fe0dd42c72dd375630
      - name: Build unmodified baseline
        run: |
          bash core/build.sh
          cp core/bin/drnas-core core/bin/drnas-core-baseline
      - name: Build scheduler candidates and check soundness
        run: |
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('core/core.cpp')
          s=p.read_text()
          patches=[["struct Core {","// Diagnostic-only scoped timers. Disabled unless DRNAS_PROFILE is set.\nstruct ProfileScope {\n    const char* name; Time started; bool enabled;\n    explicit ProfileScope(const char* n):name(n),started(Clock::now()),enabled(std::getenv(\"DRNAS_PROFILE\")!=nullptr){\n        if(enabled){std::fprintf(stderr,\"PROFILE_BEGIN %s\\n\",name);std::fflush(stderr);}\n    }\n    ~ProfileScope(){\n        if(enabled){std::fprintf(stderr,\"PROFILE_END %s %.9f\\n\",name,chrono::duration<double>(Clock::now()-started).count());std::fflush(stderr);}\n    }\n};\ntemplate<class Fn> static auto profiled(const char* name,Fn&& fn){\n    ProfileScope scope(name);return fn();\n}\nstruct Core {"],["int relations(){","int relations(){\n        ProfileScope scope(\"relations\");"],["int fusion(){","int fusion(){\n        ProfileScope scope(\"fusion\");"],["int discover(){","int discover(){\n        ProfileScope scope(\"discovery\");"],["int general(){","int general(){\n        ProfileScope scope(\"general\");"],["bool absorb(const F& additions,const F& messages,Time until){","bool absorb(const F& additions,const F& messages,Time until){\n        ProfileScope scope(\"rup_absorb\");"],["pcmax::math4::xor_unit(original.cs,original.n,hash.str(),min({left(),.25,seconds*.08}),&seed)","profiled(\"gf2\",[&](){return pcmax::math4::xor_unit(original.cs,original.n,hash.str(),min({left(),.25,seconds*.08}),&seed);})"],["pcmax::analyze_clause_hall(original.cs,original.n,hash.str(),opts)","profiled(\"hall\",[&](){return pcmax::analyze_clause_hall(original.cs,original.n,hash.str(),opts);})"],["toolbox::finite3_model(original,m,budget(.20,2.5),algebra)","profiled(\"gf3\",[&](){return toolbox::finite3_model(original,m,budget(.20,2.5),algebra);})"],["toolbox::circuit_affine_model(original,root,m,budget(.68),algebra)","profiled(\"affine_word\",[&](){return toolbox::circuit_affine_model(original,root,m,budget(.68),algebra);})"],["toolbox::cooperate(original.n,active,fixed,p,budget(.18,.7),cases,unified,4)","profiled(\"relation_cooperate\",[&](){return toolbox::cooperate(original.n,active,fixed,p,budget(.18,.7),cases,unified,4);})"],["toolbox::factor_stage(original,active,fixed,p,budget(.12,.35),factors,2)","profiled(\"relation_factor\",[&](){return toolbox::factor_stage(original,active,fixed,p,budget(.12,.35),factors,2);})"],["fusion_kernel::fusion_solve(f,budget(.52),true,0)","profiled(\"fusion_kernel\",[&](){return fusion_kernel::fusion_solve(f,budget(.52),true,0);})"]]
          for old,new in patches:
              assert s.count(old)==1,old
              s=s.replace(old,new,1)
          scheduler_patches=[["int fusion(){","int fusion(double fraction=.52,double maximum=1e30){"],["fusion_kernel::fusion_solve(f,budget(.52),true,0)","fusion_kernel::fusion_solve(f,budget(fraction,maximum),true,0)"],["        int rc=relations();if(rc)return rc;\n        rc=fusion();if(rc)return rc;\n        rc=discover();if(rc)return rc;\n        return general();","        int rc=relations();if(rc)return rc;\n        const char* raw_schedule=std::getenv(\"DRNAS_SCHEDULE\");\n        string schedule=raw_schedule?raw_schedule:\"legacy\";\n        bool eligible=!no_share&&original.n<=1500&&all.size()<=10000&&left()>.12;\n        if(eligible&&schedule==\"early\"){\n            rc=discover();if(rc)return rc;\n            rc=fusion(.62);if(rc)return rc;\n            return general();\n        }\n        if(eligible&&schedule==\"staged\"){\n            // First bounded structural attempt; do not persist incomplete search.\n            rc=fusion(.16,.40);if(rc)return rc;\n            rc=discover();if(rc)return rc;\n            // Use the checked ledger and remaining budget; restart FUSION.\n            // Reserve time for GENERAL even if the first methods fail.\n            if(left()>.08){rc=fusion(.62);if(rc)return rc;}\n            return general();\n        }\n        rc=fusion();if(rc)return rc;\n        rc=discover();if(rc)return rc;\n        return general();"]]
          for old,new in scheduler_patches:
              assert s.count(old)==1,old
              s=s.replace(old,new,1)
          selector_patches=[["int discover(){","int discover(double fraction=.50,double maximum=.6,bool responsive=false){"],["auto stop=budget(.50,.6);","auto stop=budget(fraction,maximum);"],["bool good=toolbox::satisfied(work,m)||toolbox::repair(f.n,work,m,part(.35),repair_flips);","double repair_fraction=.35;\n                if(responsive){\n                    int bad=0;double expected=0;\n                    for(const C& c:work){\n                        bool ok=false;for(int l:c)if(toolbox::value(m,l)==1){ok=true;break;}\n                        bad+=!ok;expected+=std::ldexp(1.0,-int(min<size_t>(c.size(),1024)));\n                    }\n                    double ratio=bad/max(1.0,expected);\n                    repair_fraction=ratio<.65?.55:ratio>1.10?.12:.35;\n                    std::fprintf(stderr,\"SELECTOR residual_bad=%d expected=%.6f repair_fraction=%.6f\\n\",bad,expected,repair_fraction);\n                }\n                bool good=toolbox::satisfied(work,m)||toolbox::repair(f.n,work,m,part(repair_fraction),repair_flips);"],["        if(eligible&&schedule==\"early\"){","        if(eligible&&schedule==\"selector\"){\n            // CNF-only opportunity estimate: resolution pair count, occurrence\n            // asymmetry and quality of a sign-balanced seed. No family labels.\n            vector<int> pos(original.n+1),neg(original.n+1);\n            for(const C& c:all)for(int l:c)(l>0?pos[l]:neg[-l])++;\n            int live=0,cheap=0;double skew=0;\n            for(int v=1;v<=original.n;++v)if(pos[v]+neg[v]){\n                ++live;cheap+=(1LL*pos[v]*neg[v]<=64);\n                skew+=double(abs(pos[v]-neg[v]))/(pos[v]+neg[v]);\n            }\n            double opportunity=double(cheap)/max(1,live);\n            double imbalance=skew/max(1,live);\n            double expected_bad=0;int bad=0;\n            toolbox::Model guess(original.n+1,0);\n            for(int v=1;v<=original.n;++v)guess[v]=pos[v]>neg[v];\n            for(const C& c:all){\n                bool ok=false;for(int l:c)if((guess[abs(l)]!=0)==(l>0)){ok=true;break;}\n                bad+=!ok;expected_bad+=std::ldexp(1.0,-int(min<size_t>(c.size(),1024)));\n            }\n            double seed_ratio=bad/max(1.0,expected_bad);\n            // Heuristic, frozen before the new panel. Favor constructive\n            // projection when a seed or cheap pivots offer evidence of progress.\n            bool projection_first=seed_ratio<.80 || (opportunity>.35 && imbalance>.12);\n            std::fprintf(stderr,\"SELECTOR initial=%s cheap=%.6f imbalance=%.6f seed_ratio=%.6f\\n\",\n                         projection_first?\"projection\":\"fusion\",opportunity,imbalance,seed_ratio);\n            if(!projection_first){\n                auto before=fusion_kernel::stats.split_nodes;\n                rc=fusion(.16,.40);if(rc)return rc;\n                auto nodes=fusion_kernel::stats.split_nodes-before;\n                std::fprintf(stderr,\"SELECTOR fusion_probe_nodes=%lld\\n\",(long long)nodes);\n            }\n            if(left()>.08){\n                auto prev_shared=shared;auto prev_proof=ledger.size();\n                rc=discover(.50,projection_first?.6:.35,true);if(rc)return rc;\n                double projected=double(projected_variables)/max(1,live);\n                double yield=double(shared-prev_shared)/max<size_t>(1,ledger.size()-prev_proof);\n                // Spend more of the remaining budget on FUSION when discovery\n                // produced little reduction or little reusable evidence.\n                double allocation=(projected>.15||yield>.12)?.52:.68;\n                std::fprintf(stderr,\"SELECTOR projected=%.6f yield=%.6f fusion_fraction=%.6f\\n\",projected,yield,allocation);\n                if(left()>.08){rc=fusion(allocation);if(rc)return rc;}\n            }\n            return general();\n        }\n        if(eligible&&schedule==\"early\"){"]]
          for old,new in selector_patches:
              assert s.count(old)==1,old
              s=s.replace(old,new,1)
          feedback_patches=[["int discover(double fraction=.50,double maximum=.6,bool responsive=false){","    // Diagnostic controller: keep a best witness and measure real progress in\n    // bounded local repair windows. No learned clauses, no CDCL, no family labels.\n    struct RepairProgress { int initial=0,best=0,windows=0,stalls=0; uint64_t moves=0; double elapsed=0; };\n    RepairProgress live_repair;\n    bool repair_feedback(int n,const F& cs,toolbox::Model& m,Time until){\n        live_repair=RepairProgress{};\n        auto start=Clock::now();\n        if(cs.empty())return true;\n        vector<vector<int>> occ(2*n);\n        for(int i=0;i<int(cs.size());++i){\n            if(cs[i].empty())return false;\n            for(int l:cs[i])occ[toolbox::index_of(l)].push_back(i);\n        }\n        vector<int> counts(cs.size()),slots(cs.size()),bad;\n        auto set_bad=[&](int i){slots[i]=int(bad.size());bad.push_back(i);};\n        auto clear_bad=[&](int i){int last=bad.back();bad[slots[i]]=last;slots[last]=slots[i];bad.pop_back();};\n        for(int i=0;i<int(cs.size());++i){\n            for(int l:cs[i])counts[i]+=toolbox::value(m,l)==1;\n            if(!counts[i])set_bad(i);\n        }\n        live_repair.initial=live_repair.best=int(bad.size());\n        toolbox::Model best_model=m;\n        std::mt19937 rng(20310719);\n        auto pick=[&](size_t k){return std::uniform_int_distribution<size_t>(0,k-1)(rng);};\n        const uint64_t window=uint64_t(max(256,min(8192,24*n)));\n        const uint64_t max_moves=min<uint64_t>(1000000,max<uint64_t>(4096,3000ULL*uint64_t(n)));\n        int previous=live_repair.best;\n        for(uint64_t step=0;step<max_moves&&!bad.empty();++step){\n            if((step&127)==0&&Clock::now()>=until)break;\n            const C& c=cs[bad[pick(bad.size())]];\n            int chosen=0,loss_best=INT_MAX;size_t ties=0;\n            if(rng()%100<12)chosen=c[pick(c.size())];\n            else for(int l:c){\n                int loss=0;\n                for(int i:occ[toolbox::index_of(-l)])if(counts[i]==1&&++loss>loss_best)break;\n                if(loss<loss_best){loss_best=loss;chosen=l;ties=1;}\n                else if(loss==loss_best&&pick(++ties)==0)chosen=l;\n            }\n            m[abs(chosen)]=chosen>0;\n            for(int i:occ[toolbox::index_of(chosen)])if(counts[i]++==0)set_bad(i);\n            for(int i:occ[toolbox::index_of(-chosen)])if(--counts[i]==0)clear_bad(i);\n            ++live_repair.moves;++repair_flips;\n            if(int(bad.size())<live_repair.best){live_repair.best=int(bad.size());best_model=m;}\n            if((step+1)%window==0){\n                ++live_repair.windows;\n                if(live_repair.best<previous){previous=live_repair.best;live_repair.stalls=0;}\n                else ++live_repair.stalls;\n                // More patience near a complete model; otherwise switch\n                // instead of consuming the rest of the budget on a plateau.\n                if(live_repair.stalls>=(live_repair.best<=2?6:3))break;\n            }\n        }\n        m=std::move(best_model);\n        live_repair.elapsed=chrono::duration<double>(Clock::now()-start).count();\n        std::fprintf(stderr,\"SELECTOR feedback_repair initial=%d best=%d windows=%d stalls=%d moves=%llu elapsed=%.9f\\n\",\n            live_repair.initial,live_repair.best,live_repair.windows,live_repair.stalls,\n            (unsigned long long)live_repair.moves,live_repair.elapsed);\n        return live_repair.best==0;\n    }\n    int discover(double fraction=.50,double maximum=.6,int responsive=0){"],["if(responsive){","if(responsive==1){"],["bool good=toolbox::satisfied(work,m)||toolbox::repair(f.n,work,m,part(repair_fraction),repair_flips);","bool good=toolbox::satisfied(work,m);\n                if(!good){\n                    if(responsive==2){\n                        good=repair_feedback(f.n,work,m,part(.60));\n                        // If the measured local attempt did not finish but is\n                        // close to a model, allow the original repair path too.\n                        if(!good&&live_repair.best<=2&&Clock::now()<stop)\n                            good=toolbox::repair(f.n,work,m,part(.25),repair_flips);\n                    }else good=toolbox::repair(f.n,work,m,part(repair_fraction),repair_flips);\n                }"],["        if(eligible&&schedule==\"selector\"){","        if(eligible&&schedule==\"feedback\"){\n            // Use the twice-validated staged schedule as the safety baseline.\n            rc=fusion(.16,.40);if(rc)return rc;\n            auto shared_before=shared;auto proof_before=ledger.size();\n            rc=discover(.50,.6,2);if(rc)return rc;\n            // Real progress, not the formula family: residual improvement,\n            // projected fraction and checked-message yield inform the remainder.\n            double gain=double(live_repair.initial-live_repair.best)/max(1,live_repair.initial);\n            double projected=double(projected_variables)/max(1,original.n);\n            double reuse=double(shared-shared_before)/max<size_t>(1,ledger.size()-proof_before);\n            // Give GENERAL a meaningful share when repair plateaus and little\n            // certified information was extracted; otherwise favor FUSION.\n            double fraction=(live_repair.stalls>=3&&gain<.20&&projected<.10&&reuse<.10)?.48:.62;\n            std::fprintf(stderr,\"SELECTOR feedback gain=%.6f projected=%.6f reuse=%.6f fusion_fraction=%.6f\\n\",gain,projected,reuse,fraction);\n            if(left()>.08){rc=fusion(fraction);if(rc)return rc;}\n            return general();\n        }\n        if(eligible&&schedule==\"selector\"){"]]
          for old,new in feedback_patches:
              assert s.count(old)==1,old
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          bash core/build.sh
          DRNAS_PROFILE=1 DRNAS_SCHEDULE=early python3 core/tests.py
          DRNAS_PROFILE=1 DRNAS_SCHEDULE=staged python3 core/tests.py
          DRNAS_PROFILE=1 DRNAS_SCHEDULE=selector python3 core/tests.py
          DRNAS_PROFILE=1 DRNAS_SCHEDULE=feedback python3 core/tests.py
          mkdir -p core/results
          git diff -- core/core.cpp > core/results/feedback-scheduler.patch
      - name: Fresh paired scheduling validation
        run: |
          cd core
          python3 -u - <<'PY'
          import benchmark as b
          import collections, csv, json, os, pathlib, random, secrets, subprocess, sys, time
          out=pathlib.Path('results/feedback100').resolve()
          for d in ('cnf','evidence','logs'):
              (out/d).mkdir(parents=True,exist_ok=False)
          cap=5.0
          arms=['baseline','staged','selector','feedback']
          seed=secrets.randbits(128)
          rng=random.Random(seed)
          frozen=b.source_hashes()
          freeze={'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'instrumented_sources':frozen,'seed':str(seed),'arms':arms,'cap_s':cap,'audit_s':5,'design':'100 fresh synthetic CNFs from ten fixed families; paired serial; live repair feedback vs staged and selector; one repetition; no family labels supplied','binary_hashes':{a:b.digest((b.ROOT/'bin'/('drnas-core-baseline' if a=='baseline' else 'drnas-core')).read_bytes()) for a in arms}}
          (out/'freeze.json').write_text(json.dumps(freeze,indent=2))
          def generate(f,i):
              n=[48,64,80,96,120,144,168,192,240,300][i]
              if f=='random3':
                  return n,b.random3(rng,list(range(1,n+1)),round(n*4.26))
              if f=='random4':
                  return n,[tuple(v*rng.choice([-1,1]) for v in rng.sample(range(1,n+1),4)) for _ in range(round(n*9.75))]
              if f=='mixed-planted':
                  bits={v:bool(rng.getrandbits(1)) for v in range(1,n+1)}
                  cs=[]
                  while len(cs)<5*n:
                      k=rng.choice([2,3,3,4,5])
                      c=tuple(v*rng.choice([-1,1]) for v in rng.sample(range(1,n+1),k))
                      if any(bits[abs(l)]==(l>0) for l in c):cs.append(c)
                  return n,cs
              if f=='nae3':
                  cs=[]
                  for _ in range(round(n*2.1)):
                      c=tuple(v*rng.choice([-1,1]) for v in rng.sample(range(1,n+1),3))
                      cs.extend([c,tuple(-l for l in c)])
                  return n,cs
              if f=='tseitin':
                  # Cubic graph: cycle plus random nonadjacent perfect matching.
                  vcount=max(12,n//3*2)
                  edges=[(j,(j+1)%vcount) for j in range(vcount)]
                  while True:
                      perm=list(range(vcount));rng.shuffle(perm)
                      pairs=list(zip(perm[::2],perm[1::2]))
                      if all((a-b)%vcount not in (1,vcount-1) for a,b in pairs):break
                  edges+=pairs
                  inc=[[] for _ in range(vcount)]
                  for k,(a,c) in enumerate(edges,1):inc[a].append(k);inc[c].append(k)
                  rhs=[rng.randrange(2) for _ in range(vcount)]
                  rhs[-1]=(sum(rhs[:-1])+i%2)%2
                  cs=[]
                  for vs,r in zip(inc,rhs):
                      cs+=b.gate(vs,lambda *bits,r=r:sum(bits)%2==r)
                  return len(edges),cs
              if f=='guarded-blocks':
                  # Two random formula blocks selected by a hidden Boolean gate.
                  k=n//2; cs=[]
                  for sign,vs in [(1,list(range(2,k+2))),(-1,list(range(k+2,2*k+2)))]:
                      for c in b.random3(rng,vs,round(4.26*k)):
                          cs.append((sign,)+c)
                  return 2*k+1,cs
              if f=='mixed-unplanted':
                  cs=[]
                  for _ in range(round(n*5.2)):
                      k=rng.choice([2,3,4,4,5])
                      cs.append(tuple(v*rng.choice([-1,1]) for v in rng.sample(range(1,n+1),k)))
                  return n,cs
              if f=='overlap-blocks':
                  k=n//2;overlap=max(3,k//4)
                  left=list(range(1,k+1));right=list(range(k-overlap+1,n+1))
                  cs=b.random3(rng,left,round(4.26*len(left)))+b.random3(rng,right,round(4.26*len(right)))
                  return n,cs
              if f=='xor-mixed':
                  cs=[]
                  bits={v:bool(rng.getrandbits(1)) for v in range(1,n+1)}
                  for _ in range(n//2):
                      vs=rng.sample(range(1,n+1),3)
                      parity=sum(bits[v] for v in vs)%2
                      cs+=b.gate(vs,lambda *x,r=parity:sum(x)%2==r)
                  cs+=b.random3(rng,list(range(1,n+1)),2*n,bits if i%2==0 else None)
                  return n,cs
              if f=='modular-bridge':
                  cs=[];k=n//4
                  for j in range(4):
                      vs=list(range(j*k+1,(j+1)*k+1))
                      cs+=b.random3(rng,vs,round(3.8*k))
                  for _ in range(n//2):
                      vs=[rng.randrange(j*k+1,(j+1)*k+1) for j in rng.sample(range(4),3)]
                      cs.append(tuple(v*rng.choice([-1,1]) for v in vs))
                  return 4*k,cs
              raise ValueError(f)
          families=['random3','random4','mixed-planted','nae3','tseitin','guarded-blocks','mixed-unplanted','overlap-blocks','xor-mixed','modular-bridge']
          specs=[(f,i) for f in families for i in range(10)]
          rng.shuffle(specs)
          cases=[];seen=set()
          for index,(f,i) in enumerate(specs):
              n,cs=generate(f,i)
              n,cs=b.hide(rng,n,cs)
              h=b.norm_digest(n,cs)
              if h in seen:raise RuntimeError('duplicate input')
              seen.add(h)
              cid=f'F{index:03}'
              p=out/'cnf'/f'{cid}.cnf'
              b.write(p,n,cs)
              cases.append(dict(id=cid,cohort='fresh',family=f,path='cnf/'+p.name,sha256=b.digest(p.read_bytes()),normalized_sha256=h))
          (out/'manifest.json').write_text(json.dumps(cases,indent=2))
          assert b.source_hashes()==frozen
          cpus=sorted(os.sched_getaffinity(0))
          os.sched_setaffinity(0,{cpus[0]})
          (out/'environment.json').write_text(json.dumps({'logical_cpu':cpus[0],'serial':True,'platform':list(os.uname())}))
          def attempt(case,arm):
              src=out/case['path']
              cert=out/'evidence'/f"{case['id']}.{arm}.cert"
              binary=b.ROOT/'bin'/('drnas-core-baseline' if arm=='baseline' else 'drnas-core')
              mode='default'
              env=os.environ.copy();env.pop('DRNAS_PROFILE',None);env.pop('DRNAS_SCHEDULE',None)
              if arm!='baseline':
                  env['DRNAS_PROFILE']='1';env['DRNAS_SCHEDULE']=arm
              row=dict(id=case['id'],family=case['family'],arm=arm,status='UNKNOWN',certificate='NONE',audit_s=0,telemetry={},stage_s={},unfinished_stages=[],error='')
              start=time.monotonic()
              rc=None
              try:
                  p=subprocess.run([binary,src,cert,str(cap),mode],capture_output=True,text=True,timeout=cap+.1,env=env)
                  stdout,stderr,rc=p.stdout,p.stderr,p.returncode
              except subprocess.TimeoutExpired as e:
                  stdout,stderr=e.stdout or b'',e.stderr or b''
                  if isinstance(stdout,bytes):stdout=stdout.decode(errors='replace')
                  if isinstance(stderr,bytes):stderr=stderr.decode(errors='replace')
              row['solve_s']=time.monotonic()-start
              (out/'logs'/f"{case['id']}.{arm}.txt").write_text(stdout+'\n'+stderr)
              stages=collections.Counter();pending=collections.Counter()
              for line in stderr.splitlines():
                  bits=line.split()
                  if len(bits)==2 and bits[0]=='PROFILE_BEGIN':pending[bits[1]]+=1
                  if len(bits)==3 and bits[0]=='PROFILE_END':
                      pending[bits[1]]-=1;stages[bits[1]]+=float(bits[2])
              row['selector_trace']=[line for line in stderr.splitlines() if line.startswith('SELECTOR ')]
              row['stage_s']=dict(stages)
              row['unfinished_stages']=[k for k,v in pending.items() if v>0]
              for line in stdout.splitlines():
                  if line.startswith('c {'):row['telemetry']=json.loads(line[2:])
              if rc is None or row['solve_s']>cap+.05:row['status']='TIMEOUT';return row
              if rc not in (0,10,20):row.update(status='ERROR',error=stderr[-2000:]);return row
              if rc==0:return row
              start=time.monotonic()
              try:
                  p=subprocess.run([sys.executable,b.ROOT/'verify.py',src,cert,str(rc),'--seconds','5'],capture_output=True,text=True,timeout=5.1)
                  a=json.loads(p.stdout);row.update(status=a['status'],certificate=a.get('certificate','NONE'),error=a.get('error',''))
                  if row['status'] in ('SAT','UNSAT'):row['evidence_sha256']=b.digest(cert.read_bytes())
              except subprocess.TimeoutExpired:row['status']='AUDIT_LIMIT'
              except Exception as e:row.update(status='REJECTED',error=str(e))
              row['audit_s']=time.monotonic()-start
              return row
          rows=[];disagreements=[]
          with (out/'runs.jsonl').open('w') as stream:
              for i,case in enumerate(cases):
                  assert b.digest((out/case['path']).read_bytes())==case['sha256']
                  group=[]
                  for arm in arms[i%len(arms):]+arms[:i%len(arms)]:
                      row=attempt(case,arm);rows.append(row);group.append(row)
                      stream.write(json.dumps(row)+'\n');stream.flush()
                      print('CORE_FEEDBACK_ROW '+json.dumps(row),flush=True)
                  if len({r['status'] for r in group if r['status'] in ('SAT','UNSAT')})>1:disagreements.append(case['id'])
          def stats(rr):
