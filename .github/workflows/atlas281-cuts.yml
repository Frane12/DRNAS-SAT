name: ATLAS28.1 functional cuts
on:
  push:
    branches: [experiment/atlas28-1-functional-cuts]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cuts:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/DRNAS-SAT
          run-id: 45348217885
          github-token: ${{ github.token }}
          pattern: real6-shard-*
          path: real6
      - name: Build external DRAT-trim
        run: |
          git clone --depth 1 https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          git -C /tmp/drat-trim rev-parse HEAD
          gcc -O2 /tmp/drat-trim/drat-trim.c -o /tmp/drat-check
      - name: Single CPU local functional cuts
        run: |
          set -euo pipefail
          mkdir -p results
          cpu=$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')
          taskset -c "$cpu" python3 -u research/atlas281_cuts/cuts.py real6 results | tee results/log.txt
          python3 - <<'PY'
          import json,subprocess,pathlib
          rows=[json.loads(x.split(' ',1)[1]) for x in pathlib.Path('results/log.txt').read_text().splitlines() if x.startswith('ATLAS281 ')]
          assert len(rows)==6
          for i,r in enumerate(rows):
              if r['status']=='UNSAT':
                  p=subprocess.run(['/tmp/drat-check',f'results/{i}.cnf',f'results/{i}.drup'],capture_output=True,text=True,timeout=30)
                  assert 's VERIFIED' in p.stdout,(i,p.stdout,p.stderr)
                  r['external_drat']='VERIFIED'
              else:r['external_drat']='NO_COMPLETE_PROOF'
              print('ATLAS281_AUDIT',json.dumps(r))
          pathlib.Path('results/summary.json').write_text(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS281-functional-cut-results
          path: results/
