name: DRNAS CORE - YM25 recentered vacuum contraction
on:
  push:
    branches: [development/drnas-core]
    paths: ['core/gauge_vacuum_continue*', 'core/operator.hpp', 'core/operator_verify.py', '.github/workflows/core-ym25.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libboost-dev
      - name: Build CORE
        run: bash core/build.sh
      - name: Recentered contraction and previous-range controls
        run: python3 core/gauge_vacuum_continue_tests.py
