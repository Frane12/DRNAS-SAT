name: DRNAS CORE - YM23 convergent vacuum series
on:
  push:
    branches: [development/drnas-core]
    paths: ['core/**', '.github/workflows/core-ym23.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libboost-dev
      - name: Build CORE
        run: bash core/build.sh
      - name: Automatic series and native physical loop cross-check
        run: python3 core/vacuum_series_tests.py
