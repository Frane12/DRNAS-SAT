name: DRNAS CORE - YM37 collective loop excitations
on:
  push:
    branches: [experiment/ym37-collective-loops, development/drnas-core]
    paths: ['core/ym37_*.py', 'core/YM37_COLLECTIVE_LOOPS.md', '.github/workflows/core-ym37-collective.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collective:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 core/ym37_collective_tests.py
      - run: python3 core/ym36_pair_tests.py
