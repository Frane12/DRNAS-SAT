name: ATLAS28 local congruence pilot
on:
  push:
    branches: [experiment/atlas28-local-closure]
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/DRNAS-SAT
          run-id: 45348217885
          github-token: ${{ github.token }}
          pattern: real6-shard-*
          path: real6
      - name: Local proof pilot one CPU
        run: |
          set -euo pipefail
          mkdir -p results
          cpu=$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')
          taskset -c "$cpu" python3 -u research/atlas28_local/closure.py real6 results | tee results/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS28-local-proof-pilot
          path: results/
