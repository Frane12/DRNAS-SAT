name: DRNAS UNIFIED9 - adaptive representation and exact factor composition
on:
  push:
    branches: [experiment/drnas-unified9-adaptive-factor-20261125]
    paths:
      - 'research/toolbox20_native/unified9*'
      - 'research/toolbox20_native/meta_factor.hpp'
      - '.github/workflows/drnas-unified9.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Compile frozen U8, native U9 and pinned references
        run: |
          set -eux
          mkdir -p bin kernel-evidence
          for v in 8 9; do c++ -std=c++20 -O3 -DNDEBUG research/toolbox20_native/unified$v.cpp -lcrypto -o bin/unified$v; done
          c++ -std=c++20 -O2 research/toolbox20_native/unified9_kernel.cpp -o bin/u9-kernel
          git clone https://github.com/marijnheule/drat-trim.git /tmp/drat
          git -C /tmp/drat checkout 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          cc -O2 -std=gnu99 /tmp/drat/drat-trim.c -o bin/drat-trim
          git clone https://github.com/arminbiere/kissat.git /tmp/kissat
          git -C /tmp/kissat checkout 77bc7ea68afe80751a67df8561357f193e160fb1
          (cd /tmp/kissat && ./configure && make -j2)
          cp /tmp/kissat/build/kissat bin/
          git clone https://github.com/arminbiere/cadical.git /tmp/cadical
          git -C /tmp/cadical checkout 14593f819cb242082b127396218bd60889409737
          (cd /tmp/cadical && ./configure && make -j2)
          cp /tmp/cadical/build/cadical bin/
      - name: Exhaustive factor and affine projection audit
        run: |
          bin/u9-kernel kernel-evidence
          python3 research/toolbox20_native/unified8_audit.py kernel-evidence
          python3 research/toolbox20_native/unified_smoke.py bin/unified9 bin/drat-trim
      - name: Replay, prospective fresh and public SATLIB paired benchmark
        run: |
          python3 -u research/toolbox20_native/unified9_bench.py --u8 bin/unified8 --u9 bin/unified9 --kissat bin/kissat --cadical bin/cadical --checker bin/drat-trim --out u9-results --freeze "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified9-adaptive-factor
          path: |
            kernel-evidence/
            u9-results/
          if-no-files-found: warn
