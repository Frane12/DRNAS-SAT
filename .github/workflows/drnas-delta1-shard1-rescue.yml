name: DRNAS DELTA1 retry only shard1 if Ubuntu apt mirror stalls
on:
  push:
    branches:
      - experiment/circuitcheck-delta1-affine-20261123
    paths:
      - '.github/workflows/drnas-delta1-shard1-rescue.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/DRNAS-SAT
          run-id: 45245092918
          name: circuitcheck-stress-frozen-rtl
          github-token: ${{ github.token }}
          path: frozen
      - name: Install from current apt indexes; update only if required
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive timeout 110s apt-get install -y -qq yosys time || {
            sudo timeout 120s apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive timeout 110s apt-get install -y -qq yosys time
          }
          yosys -V
      - name: Rerun exactly original DELTA1 shard1 with same sources and 30s per case
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c sources.sha256)
          python3 -u apps/circuitcheck/delta1_stress.py shard \
            --manifest frozen/manifest.json \
            --out results --shard 1 --shards 4 | tee delta1-live.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta1-shard-1
          path: |
            results/
            delta1-live.log
          if-no-files-found: warn
          retention-days: 90
