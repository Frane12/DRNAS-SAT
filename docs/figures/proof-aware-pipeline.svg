<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">DRNAS SAT proof-aware pipeline from original source CNF to independent proof verification</title>
<desc id="flow-desc">Original CNF is checked for exact-one groups and BDD transitions. Weighted root capacity, symbolic symmetry product, and restricted-group Hall bounds may derive a structural contradiction. Only when a source-based proof is emitted and accepted by independent VeriPB is the result called verified UNSAT. An unsupported or capped detector returns UNKNOWN.</desc>
<rect width="1120" height="480" fill="#f8f6ef"/>
<rect x="0.5" y="0.5" width="1119" height="479" fill="none" stroke="#d5ddd9"/>
<rect x="0" y="0" width="8" height="480" fill="#14695f"/>
<text x="31" y="38" font-family="Arial, sans-serif" font-size="14" fill="#14695f" font-weight="700" letter-spacing="1.6">DRNAS SAT  /  PROOF-AWARE REASONING</text>
<text x="31" y="82" font-family="Arial, sans-serif" font-size="30" fill="#142d3d" font-weight="700">From original clauses to independently checked proofs</text>
<text x="31" y="112" font-family="Arial, sans-serif" font-size="15" fill="#567077">Verified source implications first. No UNSAT claim from an unchecked heuristic.</text>
