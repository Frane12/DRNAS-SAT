<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" role="img" aria-labelledby="title desc">
<title id="title">Tseitin cancellation on a teaching triangle</title>
<desc id="desc">The three edge equations added modulo two cancel a, b and c twice each. An odd total vertex charge gives the contradiction zero equals one.</desc>
<rect x="0" y="0" width="560" height="190" rx="12" fill="#f8f6ef" stroke="none" stroke-width="1"/>
<line x1="100.00" y1="36.00" x2="34.00" y2="146.00" stroke="#116a62" stroke-width="3" stroke-linecap="round"/>
<line x1="34.00" y1="146.00" x2="165.00" y2="146.00" stroke="#116a62" stroke-width="3" stroke-linecap="round"/>
<line x1="165.00" y1="146.00" x2="100.00" y2="36.00" stroke="#116a62" stroke-width="3" stroke-linecap="round"/>
<circle cx="100.00" cy="36.00" r="17" fill="#f6c57e" stroke="#116a62" stroke-width="2"/>
<text x="100" y="42" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" font-size="18" fill="#152d40">1</text>
<circle cx="34.00" cy="146.00" r="17" fill="#c7e9df" stroke="#116a62" stroke-width="2"/>
<text x="34" y="152" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" font-size="18" fill="#152d40">0</text>
<circle cx="165.00" cy="146.00" r="17" fill="#c7e9df" stroke="#116a62" stroke-width="2"/>
<text x="165" y="152" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" font-size="18" fill="#152d40">0</text>
<text x="48" y="90" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#152d40">a</text>
<text x="99" y="176" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#152d40">b</text>
<text x="152" y="90" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#152d40">c</text>
<line x1="194.00" y1="16.00" x2="194.00" y2="178.00" stroke="#ced5d0" stroke-width="1" stroke-linecap="round"/>
<text x="219" y="44" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-weight="400" font-size="23" fill="#152d40">a ⊕ c = 1</text>
<text x="219" y="76" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-weight="400" font-size="23" fill="#152d40">a ⊕ b = 0</text>
<text x="219" y="108" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-weight="400" font-size="23" fill="#152d40">b ⊕ c = 0</text>
<line x1="217.00" y1="121.00" x2="531.00" y2="121.00" stroke="#526879" stroke-width="1.5" stroke-linecap="round"/>
<text x="219" y="159" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" font-size="31" fill="#116a62">0 = 1</text>
<text x="524" y="157" text-anchor="end" font-family="Arial, DejaVu Sans, sans-serif" font-weight="400" font-size="20" fill="#526879">GF(2)</text>
</svg>
