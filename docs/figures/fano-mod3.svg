<svg xmlns="http://www.w3.org/2000/svg" width="560" height="214" viewBox="0 0 560 214" role="img" aria-labelledby="title desc">
  <title id="title">The Fano plane and the possible totals for three machines</title>
  <desc id="desc">Each line through three numbered jobs is an allowed triple, including the circle. The three highlighted lines meet at job 0. A machine takes zero or three jobs, so seven lies between the possible load totals six and nine.</desc>
  <rect x="0.5" y="0.5" width="559" height="213" rx="12" fill="#f8f6ef" stroke="#d8ded8"/>
  <path d="M251 19 V195" stroke="#cbd4cf"/>

  <g id="fano-lines" fill="none" stroke="#879998" stroke-width="2.5" stroke-linecap="round">
    <path data-jobs="1 3 5" d="M126 30 L37.67 183"/>
    <path data-jobs="1 4 6" d="M126 30 L214.33 183"/>
    <path data-jobs="2 3 6" d="M37.67 183 H214.33"/>
    <circle data-jobs="2 4 5" cx="126" cy="132" r="51"/>
    <g stroke="#116a62" stroke-width="3.5">
      <path data-jobs="0 1 2" d="M126 30 V183"/>
      <path data-jobs="0 3 4" d="M37.67 183 L170.165 106.5"/>
      <path data-jobs="0 5 6" d="M214.33 183 L81.835 106.5"/>
    </g>
  </g>
  <g id="jobs" fill="#ffffff" stroke="#456563" stroke-width="1.6">
    <circle data-job="1" cx="126" cy="30" r="12"/>
    <circle data-job="2" cx="126" cy="183" r="12"/>
    <circle data-job="3" cx="37.67" cy="183" r="12"/>
    <circle data-job="4" cx="170.165" cy="106.5" r="12"/>
    <circle data-job="5" cx="81.835" cy="106.5" r="12"/>
    <circle data-job="6" cx="214.33" cy="183" r="12"/>
    <circle data-job="0" cx="126" cy="132" r="13.5" fill="#116a62" stroke="#116a62"/>
  </g>
  <g font-family="Arial, DejaVu Sans, sans-serif" text-anchor="middle" fill="#152d40">
    <g font-size="16" font-weight="700">
      <text x="126" y="35.5">1</text>
      <text x="126" y="188.5">2</text>
      <text x="37.67" y="188.5">3</text>
      <text x="170.165" y="112">4</text>
      <text x="81.835" y="112">5</text>
      <text x="214.33" y="188.5">6</text>
      <text x="126" y="137.5" fill="#ffffff">0</text>
    </g>
    <text x="406" y="46" font-size="23">n₁, n₂, n₃ ∈ {0, 3}</text>
    <path d="M287 112 H526" fill="none" stroke="#829491" stroke-width="2"/>
    <g fill="#116a62">
      <circle cx="290" cy="112" r="5.5"/>
      <circle cx="368" cy="112" r="5.5"/>
      <circle cx="446" cy="112" r="5.5"/>
      <circle cx="524" cy="112" r="5.5"/>
    </g>
    <g fill="#116a62" font-size="18" font-weight="700">
      <text x="290" y="139">0</text>
      <text x="368" y="139">3</text>
      <text x="446" y="139">6</text>
      <text x="524" y="139">9</text>
    </g>
    <text x="472" y="86" font-size="21" font-weight="700" fill="#9d482b">7</text>
    <path d="M472 92 V103 M467 107 L477 117 M477 107 L467 117" fill="none" stroke="#9d482b" stroke-width="2.5" stroke-linecap="round"/>
    <text x="406" y="183" font-size="24" font-weight="700">7 ≡ 1 (mod 3)</text>
  </g>
</svg>
