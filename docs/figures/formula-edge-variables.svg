<svg xmlns="http://www.w3.org/2000/svg" width="560" height="181" viewBox="0 0 560 181" role="img" aria-labelledby="title desc">
<title id="title">Clique positions force an edge</title>
<desc id="desc">Different selected positions i and j choose vertices u and v. Their edge must exist, so its endpoints cannot share a color. Source 9 requires five vertices and offers four colors.</desc>
<rect x="0" y="0" width="560" height="181" rx="12" fill="#f8f6ef" stroke="none" stroke-width="1"/>
<rect x="36" y="19" width="64" height="34" rx="4" fill="#fff1cf" stroke="none" stroke-width="1"/>
<text x="68" y="43" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" font-size="22" fill="#152d40">i</text>
<rect x="144" y="19" width="64" height="34" rx="4" fill="#fff1cf" stroke="none" stroke-width="1"/>
<text x="176" y="43" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" font-size="22" fill="#152d40">j</text>
<line x1="68.00" y1="54.00" x2="68.00" y2="83.00" stroke="#526879" stroke-width="2" stroke-linecap="round"/>
<line x1="68.00" y1="83.00" x2="64.00" y2="77.00" stroke="#526879" stroke-width="2" stroke-linecap="round"/>
<line x1="68.00" y1="83.00" x2="72.00" y2="77.00" stroke="#526879" stroke-width="2" stroke-linecap="round"/>
<line x1="176.00" y1="54.00" x2="176.00" y2="83.00" stroke="#526879" stroke-width="2" stroke-linecap="round"/>
<line x1="176.00" y1="83.00" x2="172.00" y2="77.00" stroke="#526879" stroke-width="2" stroke-linecap="round"/>
<line x1="176.00" y1="83.00" x2="180.00" y2="77.00" stroke="#526879" stroke-width="2" stroke-linecap="round"/>
<line x1="68.00" y1="109.00" x2="176.00" y2="109.00" stroke="#116a62" stroke-width="4" stroke-linecap="round"/>
<circle cx="68.00" cy="109.00" r="17" fill="#c7e9df" stroke="#116a62" stroke-width="2"/>
<text x="68" y="115" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" font-size="18" fill="#152d40">u</text>
<circle cx="176.00" cy="109.00" r="17" fill="#c7e9df" stroke="#116a62" stroke-width="2"/>
<text x="176" y="115" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" font-size="18" fill="#152d40">v</text>
<text x="122" y="155" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" font-size="20" fill="#116a62">Eᵤᵥ = 1</text>
<line x1="242.00" y1="25.00" x2="242.00" y2="156.00" stroke="#ced5d0" stroke-width="1" stroke-linecap="round"/>
<text x="273" y="63" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-weight="400" font-size="22" fill="#526879">u ≠ v</text>
<text x="273" y="104" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" font-size="24" fill="#152d40">color(u) ≠ color(v)</text>
<text x="273" y="144" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-weight="700" font-size="23" fill="#116a62">k = 5  &gt;  c = 4</text>
</svg>
